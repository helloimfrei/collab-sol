[project]
name = "collab-sol"
version = "0.1.0"
description = "Utilities for reproducible grade-crossing model comparisons"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
      "numpy",
      "matplotlib",
      "joblib",
      "optuna",
      "pandas==2.2.3",
      "pyarrow",
      "scikit-learn",
  ]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name='collab_sol'
module-root=''

[project.optional-dependencies]
dev = [
    "marimo",
    "pytest",
    "pyright",
]
explain = [
    "shap",
]
gpu = [
    "torch",
]
transformer = [
    "rtdl-revisiting-models",
    "torch",
]
classical = [
    "xgboost",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
